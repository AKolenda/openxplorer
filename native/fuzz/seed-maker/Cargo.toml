# Writes the 7z and Zstandard seeds Python cannot write (see ../seeds.py).
[package]
name = "ox-fuzz-seed-maker"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["compress", "bzip2"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

[workspace]
members = ["."]
