# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "2"
members = ["crates/ox-core", "crates/ox-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.80"
publish = false

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gio = "0.22"
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
thiserror = "2"
libc = "0.2"
tempfile = "3"
ox-core = { path = "crates/ox-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
