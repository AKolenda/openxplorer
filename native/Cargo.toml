# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
# A virtual workspace does not take its resolver from the edition, so name the
# edition-2021 resolver explicitly.
resolver = "2"
members = ["crates/ox-core", "crates/ox-app"]

[workspace.package]
version = "2.0.23"
edition = "2021"
license = "AGPL-3.0-only"
# The oldest Rust the locked GTK and GIO crates build with. CI checks with
# exactly this version.
rust-version = "1.92"
publish = false

[workspace.dependencies]
# GTK 4.14 is the version in Zorin OS 18 (Ubuntu 24.04), so newer GTK APIs stay
# unavailable.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
# The Wayland side of GDK: a file dialog attaches to the window of the
# application that opened it (xdg-foreign); its version follows gtk.
gdk-wayland = { package = "gdk4-wayland", version = "0.11" }
gio = "0.22"
# GTK 4.14 needs GLib 2.76, so its APIs (GBookmarkFile among them) are safe.
glib = { version = "0.22", features = ["v2_76"] }
# Compiles the GResource bundles in build scripts; its version follows glib.
glib-build-tools = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
thiserror = "2"
# Carries answers and progress from dialogs and GIO worker threads to the
# GTK main loop, as the gtk-rs book does.
async-channel = "2"
rustix = { version = "1", features = ["fs"] }
# The search cache is the SQLite database the Python app shares. It links the
# system SQLite, as Python's sqlite3 module does, so building needs its
# development files (libsqlite3-dev on Ubuntu). "hooks" provides the progress
# handler that cancels a running search.
rusqlite = { version = "0.43", default-features = false, features = ["functions", "hooks"] }
# The Secret Service client for SMB credentials (session_credentials.py used
# libsecret). Pure Rust with an encrypted session, so no C library or -dev
# package is needed; async-io keeps it independent of Tokio.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
# ZIP member decompression for ox-core's `archive`: raw deflate, bzip2 and LZMA
# are the methods besides "stored" that v2.0.0:desktop/zip_extraction.py accepts; the
# same gzip, bzip2 and XZ decoders read .tar.gz, .tar.bz2 and .tar.xz
# archives, and XZ writes .tar.xz (ARC-023, ARC-024). All are pure Rust, so no
# C library is linked.
flate2 = "1.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization", "xz", "encoder"] }
# Writing .7z archives for Compress to › 7z File, as Windows 11 offers it
# (ARC-023), and decoding the data of the 7z archives the app browses and
# extracts (ARC-022, ARC-024). Pure Rust, Apache-2.0. Pinned: 0.20.2 is the
# last release that builds with this workspace's rust-version (0.21 and later
# need 1.93); it brings its own lzma-rust2 0.16 for LZMA and LZMA2. "bzip2"
# decodes BZip2 7z archives with the bzip2 crate above, adding nothing to the
# build. Not enabled: encryption (Windows 11 refuses encrypted archives too),
# PPMd, and "deflate", which would turn on flate2's zlib-rs backend.
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["compress", "bzip2"] }
# Zstandard decompression for .tar.zst archives (ARC-024), pure Rust like the
# decoders above.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# The CRC-32 every extracted or previewed ZIP member is checked against.
crc32fast = "1.5"
tempfile = "3"
# The Details tab of Properties reads a video's or audio file's streams and
# tags with GStreamer's discoverer (gst-pbutils), as the GNOME file managers
# do, in a child process (ox-app's `media_details`). Building needs
# libgstreamer1.0-dev and libgstreamer-plugins-base1.0-dev; the app's GTK
# already loads these libraries for video previews.
gstreamer = "0.25"
gstreamer-pbutils = "0.25"
# A picture's EXIF for the same tab: pure Rust, reading only bytes already
# in memory, so no C library parses the picture.
kamadak-exif = "0.6.1"
# The SMB client that asks a server for the shadow copies of a share, as
# Windows' Previous Versions tab does (FSCTL_SRV_ENUMERATE_SNAPSHOTS): GIO,
# GVfs and libsmbclient cannot send that request. MIT. On Linux it builds as
# Rust only, and "single_threaded" runs it on the calling thread without an
# async runtime; Cargo.lock also lists tokio, reqwest and rustls, which its
# sign-in crate (sspi) uses only on other platforms or for Kerberos, which is
# not enabled. Signing and encryption let it reach shares that require them.
# Pinned, as its sub-crates are pinned to the same version.
smb = { version = "=0.12.1", default-features = false, features = ["single_threaded", "sign", "encrypt"] }
# Reads the shadow-copy list as raw bytes: smb's own reply type cannot read
# an empty list and unwraps what it cannot read. The version smb uses.
binrw = "0.15"
ox-core = { path = "crates/ox-core" }

# Every crate inherits these lints with `[lints] workspace = true`, so editors,
# `cargo clippy` and native/tools/check.py report the same findings. The check
# driver turns every warning into a failure.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The pedantic lints below are allowed because they flag deliberate choices,
# so their warnings would be noise rather than findings.
#
# Items are named for what they are, even when that repeats their module, as in
# `entry::EntryKind` or `clipboard::ClipboardMode`. Clippy 1.84 moved this lint
# from pedantic to restriction; the entry records the decision for anyone who
# enables it by name.
module_name_repetitions = "allow"
# `#[must_use]` is written where ignoring a result is a real mistake. Adding it
# to every pure function would hide those few among hundreds.
must_use_candidate = "allow"
# Related names such as `row` and `rows` are clearer than invented synonyms.
similar_names = "allow"

[profile.release]
# Thin LTO optimises across crates without the long link times of full LTO.
lto = "thin"
