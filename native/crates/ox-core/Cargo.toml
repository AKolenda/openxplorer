# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "ox-core"
description = "OpenXplorer toolkit-independent core: locations, settings, entries and the transfer engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gio.workspace = true
glib.workspace = true
serde.workspace = true
# Brave's preferences hold 17-digit doubles such as zoom levels. The default
# float parser is not correctly rounded, so a sync would rewrite preferences it
# must leave alone; float_roundtrip reads every number back exactly, as
# Python's json does.
serde_json = { workspace = true, features = ["float_roundtrip"] }
percent-encoding.workspace = true
thiserror.workspace = true
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
