# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "ox-core"
description = "OpenXplorer toolkit-independent core: locations, settings, entries and the transfer engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gio.workspace = true
glib.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
libc.workspace = true
# The search index's inotify watcher waits on its descriptor with poll(2).
rustix = { workspace = true, features = ["event"] }
# The search cache is the SQLite database the Python app shares. It links the
# system SQLite, as Python's sqlite3 module does, so building needs its
# development files (libsqlite3-dev on Ubuntu). "hooks" provides the progress
# handler that cancels a running search.
rusqlite = { version = "0.38", default-features = false, features = ["hooks"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
