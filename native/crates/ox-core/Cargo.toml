# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "ox-core"
description = "OpenXplorer toolkit-independent core: locations, settings, entries and the transfer engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gio.workspace = true
glib.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
libc.workspace = true
# `process` gives `setsid`, which starts `openxplorer --restart` in its own
# session as desktop/winspace.py does (`update::SessionLauncher`).
rustix = { workspace = true, features = ["process"] }
# The updater's HTTPS client. libsoup is GNOME's HTTP library: it uses the
# desktop's proxy settings and the system's certificate store through
# glib-networking, and takes a `gio::Cancellable`. Building needs
# libsoup-3.0-dev.
soup3 = "0.9"
# The updater's private download folder (`release-XXXXXX`, mode 0700), which
# is deleted with everything in it whether the installation succeeds or fails.
tempfile.workspace = true
# Delivering installation progress from the worker thread to the main
# thread's `UpdateService::install` future. GLib's own futures support
# already builds both.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
