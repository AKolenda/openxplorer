# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "ox-core"
description = "OpenXplorer toolkit-independent core: locations, settings, entries and the transfer engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gio.workspace = true
glib.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
libc.workspace = true
# The search index's inotify watcher waits on its descriptor with poll(2).
rustix = { workspace = true, features = ["event"] }
# The search cache; [workspace.dependencies] says why it links the system
# SQLite.
rusqlite.workspace = true
oo7.workspace = true
# ZIP decompression and CRC-32 checks for `archive`; see the workspace manifest.
flate2.workspace = true
bzip2.workspace = true
lzma-rust2.workspace = true
crc32fast.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
