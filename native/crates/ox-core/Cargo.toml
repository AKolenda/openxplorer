[package]
name = "ox-core"
description = "OpenXplorer toolkit-independent core: locations, settings, entries and the transfer engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gio.workspace = true
glib.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
libc.workspace = true
rustix.workspace = true
# The Secret Service client for SMB credentials (session_credentials.py used
# libsecret). Pure Rust with an encrypted session, so no C library or -dev
# package is needed; async-io keeps it independent of Tokio.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
