# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "ox-app"
description = "OpenXplorer native GTK4 application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "openxplorer-native"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
gtk.workspace = true
gdk-wayland.workspace = true
gio.workspace = true
glib.workspace = true
ox-core.workspace = true
gstreamer.workspace = true
gstreamer-pbutils.workspace = true
kamadak-exif.workspace = true
# The Details tab's reader writes what it read as JSON to the app.
serde.workspace = true
serde_json.workspace = true
# The Details tab's reader limits its own processor time.
rustix = { workspace = true, features = ["process"] }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
# Writes the .tar.zst fixtures of the archive tests.
ruzstd.workspace = true

[build-dependencies]
glib-build-tools.workspace = true
