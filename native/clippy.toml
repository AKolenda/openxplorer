# Clippy's configuration for every crate of the workspace.
#
# Names that documentation may write without backticks. Clippy 1.92, the
# minimum supported Rust that CI checks with, does not yet know "SQLite";
# newer versions do. "WebDAV" is the protocol's own spelling. ".." keeps
# Clippy's own list.
doc-valid-idents = ["SQLite", "WebDAV", ".."]
