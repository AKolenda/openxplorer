name: Build, release and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openxplorer-production
  cancel-in-progress: false
jobs:
  # The release packages of the native app (native/packaging/README.md), built
  # on hosted runners in each distribution's container, and uploaded as
  # artifacts that the release job below publishes. The Python app in
  # desktop/ is deprecated and no longer packaged.
  native-package:
    if: github.ref == 'refs/heads/main'
    name: Release package (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          # Ubuntu 24.04 is the oldest supported base, so the .deb built on it
          # (dpkg-shlibdeps records its library versions) installs on Zorin OS
          # 18, Ubuntu 24.04 and newer, and Debian 13.
          - name: Debian package
            image: ubuntu:24.04
            family: debian
            format: deb
          - name: Fedora RPM
            image: fedora:latest
            family: fedora
            format: rpm
          - name: openSUSE RPM
            image: opensuse/tumbleweed:latest
            family: opensuse
            format: rpm
          - name: Arch package
            image: archlinux:latest
            family: arch
            format: arch
    env:
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - name: Install Git, so the checkout is a repository
        run: |
          case "${{ matrix.family }}" in
            fedora) dnf -y install git-core ;;
            opensuse) zypper --non-interactive install git-core ;;
            arch) pacman -Syu --noconfirm --needed git ;;
            debian) apt-get update && apt-get install -y git ca-certificates ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build, check and packaging tools
        run: sh native/packaging/ci/prepare-container.sh "${{ matrix.family }}"
      - name: Install Rust 1.92.0 and stable with rustup
        run: runuser -u builder -- sh native/packaging/ci/install-rust.sh
      - name: Run the native check driver
        run: runuser -u builder -- sh native/packaging/ci/run-checks.sh
      - name: Build and verify the stable ${{ matrix.format }} package
        run: >-
          runuser -u builder -- sh native/packaging/ci/build-package.sh
          "${{ matrix.format }}" io.winspace.Development
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.family }}-${{ matrix.format }}
          path: dist/native/
          if-no-files-found: error

  native-flatpak:
    if: github.ref == 'refs/heads/main'
    name: Release Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      # flatpak-builder needs a privileged container for its sandbox.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the stable Flatpak bundle offline
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: native/packaging/flatpak/io.winspace.Development.yml
          bundle: io.winspace.Development.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-release-${{ hashFiles('native/Cargo.lock') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-flatpak
          path: io.winspace.Development.flatpak
          if-no-files-found: error

  release:
    # Public pull requests and non-main dispatches must not run on the LAN host.
    if: github.ref == 'refs/heads/main'
    needs: [native-package, native-flatpak]
    runs-on: [self-hosted, Linux, X64, openxplorer]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TMPDIR: /var/tmp/openxplorer-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Activate the pinned package manager without administrator access
        run: |
          test -s pnpm-lock.yaml
          npm install --prefix "$RUNNER_TEMP/package-manager" pnpm@10.34.5
          echo "$RUNNER_TEMP/package-manager/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm check
      - run: pnpm build
      - name: Prepare browser tests
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/browser-tests/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/browser-tests/bin/python" - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM=' + playwright.chromium.executable_path + '\n')
          PY
      - name: Verify production export, hydration and mobile preview removal
        run: '"$RUNNER_TEMP/browser-tests/bin/python" tests/test_launch_production.py'
      - name: Verify generated documentation
        run: git diff --exit-code -- docs apps/web/public/docs-markdown apps/web/public/assets/markdown.json
      - run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
        working-directory: desktop
      - run: node --test desktop/tests/*.test.cjs
      - name: Verify release source and public-data policies
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_release_source.py'
          /usr/bin/python3 -m unittest discover -s tests -p 'test_public_data.py'
      - run: /usr/bin/python3 -m unittest tests.gio_integration
        working-directory: desktop
      - run: /usr/bin/python3 tools/security_sweep.py
      - name: Verify drag and updater UI
        run: |
          /usr/bin/python3 desktop/tools/build_preview.py
          "$RUNNER_TEMP/browser-tests/bin/python" desktop/tests/ui_file_drag.py
          node desktop/tests/ui_regressions.cjs
      - name: Verify native file transport with WebKit sandbox enabled
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            env GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            "$RUNNER_TEMP/browser-tests/bin/python" desktop/tests/native_file_transport.py
      - name: Download the native release packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Stage the verified native packages and corresponding source
        run: /usr/bin/python3 tools/release.py --packages "$RUNNER_TEMP/packages"
      - name: Audit complete release
        run: /usr/bin/python3 tools/audit-public-data.py
      - name: Publish a new desktop version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
          else
            python3 - <<'PY'
          import os
          from pathlib import Path
          notes = Path('CHANGELOG.md').read_text().split('\n# ', 1)[0]
          (Path(os.environ['RUNNER_TEMP'])/'release-notes.md').write_text(notes)
          PY
            # Every asset SHA256SUMS lists (the packages and the source
            # archive), then SHA256SUMS itself. The 1.1.x updater looks only
            # for openxplorer_<version>_all.deb.
            test -s "dist/openxplorer_${version}_all.deb"
            mapfile -t assets < <(awk '{ print "dist/" $2 }' dist/SHA256SUMS)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OpenXplorer $version" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${assets[@]}" dist/SHA256SUMS
          fi
      - name: Deploy the verified website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --dry-run
          pnpm exec wrangler deploy
