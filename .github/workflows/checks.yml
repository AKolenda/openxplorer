name: Build, release and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openxplorer-production
  cancel-in-progress: false
jobs:
  release:
    # Public pull requests and non-main dispatches must not run on the LAN host.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, openxplorer]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TMPDIR: /var/tmp/openxplorer-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Activate the pinned package manager without administrator access
        run: |
          test -s pnpm-lock.yaml
          npm install --prefix "$RUNNER_TEMP/package-manager" pnpm@10.34.5
          echo "$RUNNER_TEMP/package-manager/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm check
      - run: pnpm build
      - name: Prepare browser tests
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/browser-tests/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/browser-tests/bin/python" - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM=' + playwright.chromium.executable_path + '\n')
          PY
      - name: Verify production export, hydration and mobile preview removal
        run: '"$RUNNER_TEMP/browser-tests/bin/python" tests/test_launch_production.py'
      - name: Verify generated documentation
        run: git diff --exit-code -- docs apps/web/public/docs-markdown apps/web/public/assets/markdown.json
      - run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
        working-directory: desktop
      - run: node --test desktop/tests/*.test.cjs
      - name: Verify release source and public-data policies
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_release_source.py'
          /usr/bin/python3 -m unittest discover -s tests -p 'test_public_data.py'
      - run: /usr/bin/python3 -m unittest tests.gio_integration
        working-directory: desktop
      - run: /usr/bin/python3 tools/security_sweep.py
      - name: Verify drag and updater UI
        run: |
          /usr/bin/python3 desktop/tools/build_preview.py
          "$RUNNER_TEMP/browser-tests/bin/python" desktop/tests/ui_file_drag.py
          node desktop/tests/ui_regressions.cjs
      - name: Verify native file transport with WebKit sandbox enabled
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            env GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            "$RUNNER_TEMP/browser-tests/bin/python" desktop/tests/native_file_transport.py
      - name: Stage matching installer and corresponding source
        run: /usr/bin/python3 tools/release.py
      - name: Audit complete release
        run: /usr/bin/python3 tools/audit-public-data.py
      - name: Publish a new desktop version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
          else
            python3 - <<'PY'
          import os
          from pathlib import Path
          notes = Path('desktop/CHANGELOG.md').read_text().split('\n# ', 1)[0]
          (Path(os.environ['RUNNER_TEMP'])/'release-notes.md').write_text(notes)
          PY
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OpenXplorer $version" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "dist/openxplorer_${version}_all.deb" "dist/openxplorer-${version}-source.zip" dist/SHA256SUMS
          fi
      - name: Deploy the verified website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --dry-run
          pnpm exec wrangler deploy
