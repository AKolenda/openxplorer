name: Build, release and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openxplorer-production
  cancel-in-progress: false
jobs:
  # The release packages of the native app (native/packaging/README.md), built
  # on hosted runners in each distribution's container, and uploaded as
  # artifacts that the release job below publishes. The Python app of 1.x
  # is retired (tag v1.1.4) and no longer packaged.
  native-package:
    if: github.ref == 'refs/heads/main'
    name: Release package (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # The release needs the Debian package, which the 1.1.x updater
    # installs, and the Flatpak. An RPM or Arch package that fails to build
    # is left out of the release instead of holding it back; tools/release.py
    # publishes the packages that were built.
    continue-on-error: ${{ matrix.optional }}
    container:
      image: ${{ matrix.image }}
    strategy:
      # One package's failure must not cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 is the oldest supported base, so the .deb built on it
          # (dpkg-shlibdeps records its library versions) installs on Zorin OS
          # 18, Ubuntu 24.04 and newer, and Debian 13.
          - name: Debian package
            image: ubuntu:24.04
            family: debian
            format: deb
            optional: false
          # The rolling and newest releases, as in native-distros.yml; each
          # RPM is built against its own distribution's libraries.
          - name: Fedora RPM
            image: fedora:latest
            family: fedora
            format: rpm
            optional: true
          - name: openSUSE RPM
            image: opensuse/tumbleweed:latest
            family: opensuse
            format: rpm
            optional: true
          - name: Arch package
            image: archlinux:latest
            family: arch
            format: arch
            optional: true
    env:
      CARGO_TERM_COLOR: always
      # Skips the few tests whose results depend on the distribution's
      # GVfs, Python or Node versions; the Native Rust checks job runs them.
      OX_DISTRO_CI: "1"
    permissions:
      contents: read
    steps:
      - name: Install Git, so the checkout is a repository
        run: |
          case "${{ matrix.family }}" in
            fedora) dnf -y install git-core ;;
            opensuse) zypper --non-interactive install git-core ;;
            arch) pacman -Syu --noconfirm --needed git ;;
            debian) apt-get update && apt-get install -y git ca-certificates ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build, check and packaging tools
        run: sh native/packaging/ci/prepare-container.sh "${{ matrix.family }}"
      - name: Install Rust 1.92.0 and stable with rustup
        run: runuser -u builder -- sh native/packaging/ci/install-rust.sh
      - name: Run the native check driver
        run: runuser -u builder -- sh native/packaging/ci/run-checks.sh
      - name: Build and verify the stable ${{ matrix.format }} package
        run: >-
          runuser -u builder -- sh native/packaging/ci/build-package.sh
          "${{ matrix.format }}" io.winspace.Development
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.family }}-${{ matrix.format }}
          path: dist/native/
          if-no-files-found: error
          # Only the release job of this run downloads it. Its self-hosted runner
          # can leave it queued for a day, and a failed release can be re-run.
          retention-days: 3

  native-flatpak:
    if: github.ref == 'refs/heads/main'
    name: Release Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      # flatpak-builder needs a privileged container for its sandbox.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the stable Flatpak bundle offline
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: native/packaging/flatpak/io.winspace.Development.yml
          bundle: io.winspace.Development.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-release-${{ hashFiles('native/Cargo.lock') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-flatpak
          path: io.winspace.Development.flatpak
          if-no-files-found: error
          # Only the release job of this run downloads it. Its self-hosted runner
          # can leave it queued for a day, and a failed release can be re-run.
          retention-days: 3

  website:
    # The website deploys on its own, so a failed package release (or one that
    # is not due) never leaves the site behind. Its download button opens
    # GitHub's latest release, so it needs no release to exist first. Public
    # pull requests and non-main dispatches must not run on the LAN host.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, openxplorer]
    # The Cloudflare token is a secret of this environment, which only main
    # may use, so a workflow pushed on another branch cannot read it.
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TMPDIR: /var/tmp/openxplorer-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Activate the pinned package manager without administrator access
        run: |
          test -s pnpm-lock.yaml
          npm install --prefix "$RUNNER_TEMP/package-manager" pnpm@10.34.5
          echo "$RUNNER_TEMP/package-manager/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm check
      - run: pnpm build
      - name: Prepare browser tests
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/browser-tests/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/browser-tests/bin/python" - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM=' + playwright.chromium.executable_path + '\n')
          PY
      - name: Verify production export, hydration and mobile preview removal
        run: '"$RUNNER_TEMP/browser-tests/bin/python" tests/test_launch_production.py'
      - name: Verify generated documentation
        run: git diff --exit-code -- docs apps/web/public/docs-markdown apps/web/public/assets/markdown.json
      - name: Verify release source and public-data policies
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_release_source.py'
          /usr/bin/python3 -m unittest discover -s tests -p 'test_public_data.py'
      - run: /usr/bin/python3 tools/security_sweep.py
      - name: Deploy the verified website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --dry-run
          pnpm exec wrangler deploy

  release:
    # Public pull requests and non-main dispatches must not run on the LAN host.
    if: github.ref == 'refs/heads/main'
    needs: [native-package, native-flatpak]
    runs-on: [self-hosted, Linux, X64, openxplorer]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TMPDIR: /var/tmp/openxplorer-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify release source and public-data policies
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_release_source.py'
          /usr/bin/python3 -m unittest discover -s tests -p 'test_public_data.py'
      - run: /usr/bin/python3 tools/security_sweep.py
      - name: Download the native release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Stage the verified native packages and corresponding source
        run: /usr/bin/python3 tools/release.py --packages "$RUNNER_TEMP/packages"
      - name: Point out optional packages missing from the release
        # A failed optional leg reports success to needs, so name each
        # package that is not staged in the run summary.
        run: |
          check() {
            grep -Eq "$2" dist/SHA256SUMS \
              || echo "::warning::The $1 is not in this release: its build job failed."
          }
          check "Fedora RPM" '\.fc[0-9]+\.[^ ]+\.rpm$'
          check "openSUSE RPM" '\.opensuse_[^ ]+\.rpm$'
          check "Arch package" '\.pkg\.tar\.zst$'
      - name: Audit complete release
        run: /usr/bin/python3 tools/audit-public-data.py
      - name: Publish a new desktop version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
          else
            python3 - <<'PY'
          import os
          from pathlib import Path
          # The newest section, without its "# <version> — <date>" heading,
          # which the release's title already gives.
          section = Path('CHANGELOG.md').read_text().split('\n# ', 1)[0]
          notes = section.split('\n', 1)[1].lstrip('\n')
          (Path(os.environ['RUNNER_TEMP'])/'release-notes.md').write_text(notes)
          PY
            # Every asset SHA256SUMS lists (the packages and the source
            # archive), then SHA256SUMS itself. The 1.1.x updater looks only
            # for openxplorer_<version>_all.deb.
            test -s "dist/openxplorer_${version}_all.deb"
            mapfile -t assets < <(awk '{ print "dist/" $2 }' dist/SHA256SUMS)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OpenXplorer $version" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${assets[@]}" dist/SHA256SUMS
          fi
