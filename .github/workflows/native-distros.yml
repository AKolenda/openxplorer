name: Native distribution packages
# Runs the native check driver on each supported distribution's own GTK,
# GLib and GVfs, and builds, verifies and publishes the preview package of
# that distribution's format, plus the Flatpak every distribution can
# install. native/packaging/README.md describes the formats; native-checks.yml
# stays the quick check on the minimum supported Rust.
on:
  push:
    branches: [main]
    paths:
      # The app, its packaging and tools, and the licences the packages ship.
      # The 1.1.x updater the packages must satisfy is read from tag v2.0.0
      # (native/tools/python_app.py).
      - 'native/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/native-distros.yml'
  workflow_dispatch:
# Pull requests do not start it; run it on a branch with "Run workflow"
# (workflow_dispatch). A new run on a branch other than main cancels the one
# it replaces, so superseded packages are never built or stored.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# The jobs only read the repository.
permissions:
  contents: read
env:
  # Skips the few tests whose results depend on the distribution's GVfs,
  # Python or Node versions; the Native Rust checks job runs them.
  OX_DISTRO_CI: "1"

jobs:
  distribution:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
    strategy:
      # One distribution's failure must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # The rolling and newest releases track new GTK and GLib versions;
          # Ubuntu 24.04 (Zorin OS 18) and Debian 13 are the oldest
          # distributions with GTK 4.14, which the native packages need.
          # Debian 12 has GTK 4.8, so its users install the Flatpak.
          - name: Fedora
            image: fedora:latest
            family: fedora
            format: rpm
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            family: opensuse
            format: rpm
          - name: Arch Linux
            image: archlinux:latest
            family: arch
            format: arch
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: debian
            format: deb
          - name: Debian 13
            image: debian:13
            family: debian
            format: deb
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install Git, so the checkout is a repository
        # The source archives and the packages' timestamps come from the last
        # commit, which a checkout without Git does not have.
        run: |
          case "${{ matrix.family }}" in
            fedora) dnf -y install git-core ;;
            opensuse) zypper --non-interactive install git-core ;;
            arch) pacman -Syu --noconfirm --needed git ;;
            debian) apt-get update && apt-get install -y git ca-certificates ;;
          esac
      # Actions are pinned to a commit, so a moved tag cannot change what runs.
      # persist-credentials: false keeps the token out of .git/config, where
      # later steps could read it.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build, check and packaging tools
        # Also adds the unprivileged user "builder" that the next steps use.
        run: sh native/packaging/ci/prepare-container.sh "${{ matrix.family }}"
      - name: Install Rust 1.92.0 and stable with rustup
        run: runuser -u builder -- sh native/packaging/ci/install-rust.sh
      - name: Run the native check driver
        run: runuser -u builder -- sh native/packaging/ci/run-checks.sh
      - name: Build and verify the ${{ matrix.format }} package
        run: runuser -u builder -- sh native/packaging/ci/build-package.sh "${{ matrix.format }}"
      - name: Publish the package as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openxplorer-native-${{ matrix.family }}-${{ matrix.format }}
          path: dist/native/
          if-no-files-found: error
          # Preview packages are for trying a change, not for keeping; the
          # release packages come from checks.yml.
          retention-days: ${{ github.ref != 'refs/heads/main' && 3 || 7 }}

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Flathub's image with flatpak-builder and the GNOME 51 SDK the
      # manifest names; flatpak-builder needs a privileged container for its
      # sandbox.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the preview Flatpak
        # Builds offline from native/packaging/flatpak/cargo-sources.json and
        # leaves io.winspace.Development.Native.flatpak for the next step,
        # since the action's own upload cannot shorten the retention.
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: native/packaging/flatpak/io.winspace.Development.Native.yml
          bundle: io.winspace.Development.Native.flatpak
          cache-key: flatpak-builder-${{ hashFiles('native/Cargo.lock') }}
          upload-artifact: false
      - name: Publish the bundle as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io.winspace.Development.Native-x86_64.flatpak
          path: io.winspace.Development.Native.flatpak
          if-no-files-found: error
          retention-days: ${{ github.ref != 'refs/heads/main' && 3 || 7 }}

  # Keeps only the newest packages. Once every package of this run is
  # published, deletes the preview packages of every run older than the newest
  # successful one, on any branch, including this run's own when a newer run
  # already succeeded. Storage then holds one build instead of one per push,
  # and a run whose packages failed keeps the previous ones.
  prune-artifacts:
    name: Delete earlier preview packages
    needs: [distribution, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One cleanup at a time, so two never delete the same artifact.
    concurrency:
      group: ${{ github.workflow }}-prune-artifacts
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Delete preview packages older than the newest successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-distros.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // 0')
          keep=$(( newest > GITHUB_RUN_ID ? newest : GITHUB_RUN_ID ))
          # Lists every page before deleting, since deleting shifts the pages.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "
            .artifacts[]
            | select(.expired | not)
            | select(.workflow_run.id < $keep)
            | select((.name | startswith(\"openxplorer-native-\")) or .name == \"io.winspace.Development.Native-x86_64.flatpak\")
            | .id")
          for id in $ids; do
            if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" 2>"$RUNNER_TEMP/delete.err"; then
              # Already expired or deleted.
              grep -q 'HTTP 404' "$RUNNER_TEMP/delete.err" || { cat "$RUNNER_TEMP/delete.err" >&2; exit 1; }
            fi
          done
