name: Native Rust checks
# Pull requests are checked here on hosted runners. checks.yml runs only on
# pushes to main, on the production host, so anything this workflow skips is
# first checked after it has merged.
on:
  pull_request:
    # One list for both triggers, shared through a YAML anchor so the two
    # cannot drift apart.
    paths: &checked-paths
      # Native sources, and the Python app whose behaviour and settings they
      # must match (parity inventory, bridge and settings interop tests).
      # tools/release.py also imports desktop/core.py.
      - 'native/**'
      - 'desktop/**'
      # The other inputs of the release-source and public-data policy tests.
      - '.gitignore'
      - 'tools/release.py'
      - 'tools/audit-public-data.py'
      - 'tests/test_release_source.py'
      - 'tests/test_public_data.py'
      - '.github/workflows/native-checks.yml'
  push:
    branches: [main]
    paths: *checked-paths
  workflow_dispatch:
# The jobs only read the repository.
permissions:
  contents: read
jobs:
  native:
    # Public code is checked on a hosted runner, never the production LAN host.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs.
      # persist-credentials: false keeps the token out of .git/config, where
      # later steps could read it.
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install GTK 4, SQLite and the private-display test tools
        # The search cache links the system SQLite (libsqlite3-dev). xvfb and
        # xauth provide xvfb-run and Xvfb. dbus-x11 depends on dbus-daemon,
        # which provides dbus-run-session.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libsqlite3-dev xvfb xauth dbus-x11
      - name: Install Rust 1.92.0, the minimum supported version
        # Must match rust-version in native/Cargo.toml.
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.92.0
      - name: Run the native check driver
        # Parity inventories, rustfmt, Clippy with the workspace lints, and every
        # Rust test on a private X display and D-Bus session.
        run: python3 native/tools/check.py

  release-policies:
    # A separate job, so these quick tests need neither GTK nor Rust and report
    # on their own. Path filters apply to the whole workflow, so a change to a
    # policy input also runs the native job. checks.yml repeats these tests as
    # the gate before publishing.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the corresponding-source archive policy
        run: python3 -m unittest discover -s tests -p 'test_release_source.py'
      - name: Test the public-data audit
        run: python3 -m unittest discover -s tests -p 'test_public_data.py'
